#!/bin/sh
#
# @file kayak.cfg
# @brief Kayak unattended installation configuration script for OmniOS CE
# @description
#   This configuration script is fetched by the OmniOS Kayak miniroot during
#   an unattended network/ISO installation. It automatically detects the
#   target root installation disk across hypervisors (VirtualBox, VMware,
#   QEMU/KVM, Parallels, UTM), constructs the ZFS root pool (rpool), sets the
#   system hostname and DNS configuration, registers post-boot provisioning
#   actions (network DHCP configuration, vagrant user creation with staff
#   group and sudo/RBAC privileges, and SSH daemon configuration), and reboots
#   the system into the installed environment.
#

#
# @function find_target_disk
# @description
#   Discovers the primary disk device suitable for the root ZFS pool installation
#   by querying format output, filtering out ramdisk, loop, and CD-ROM devices.
# @noargs
# @return [String] Prints the disk device name (e.g., c1t0d0) to standard output.
#
find_target_disk() {
  _found=""
  for _d in $(echo | format 2>/dev/null | awk '/^[ ]*[0-9]+\./ {print $2}'); do
    case "$_d" in
      *cdrom*|*ramdisk*|*loop*|"")
        continue
        ;;
      *)
        _found="$_d"
        break
        ;;
    esac
  done
  if [ -z "$_found" ]; then
    # Fallback to standard hypervisor SCSI/SATA primary disk identifier
    _found="c1t0d0"
  fi
  printf '%s
' "$_found"
}

TARGET_DISK=$(find_target_disk)

# Construct ZFS root pool on detected target disk
BuildRpool "$TARGET_DISK"

# Configure system identity and localization
SetHostname omnios-bento
SetTimezone UTC

# Configure DNS nameservers
SetDNS 1.1.1.1 8.8.8.8

# Set root password to 'vagrant' ($5$ SHA-256 crypt)
RootPW '$5$JsTLqHcZ$nAJVjxQ48k8YyIFaAo4.L0980WHDeDJbYt2caVuRw34'
SetRootPW

# Schedule post-boot network initialization
Postboot 'NIC=$(dladm show-phys -p -o LINK 2>/dev/null | head -n1); [ -z "$NIC" ] && NIC=e1000g0; ipadm create-if "$NIC" 2>/dev/null || true; ipadm create-addr -T dhcp "$NIC"/v4 2>/dev/null || true'
Postboot 'for iface in e1000g0 vioif0 vmxnet3s0; do ipadm create-if "$iface" 2>/dev/null && ipadm create-addr -T dhcp "$iface"/v4 2>/dev/null && break; done'

# Create vagrant user account and set password to 'vagrant'
Postboot 'useradd -m -d /export/home/vagrant -s /usr/bin/bash -g staff -G primary,sysadmin vagrant 2>/dev/null || true'
Postboot 'passmgmt -m -p "\$5\$JsTLqHcZ\$nAJVjxQ48k8YyIFaAo4.L0980WHDeDJbYt2caVuRw34" vagrant 2>/dev/null || sed -i "s|^vagrant:[^:]*:|vagrant:\$5\$JsTLqHcZ\$nAJVjxQ48k8YyIFaAo4.L0980WHDeDJbYt2caVuRw34:|" /etc/shadow 2>/dev/null || true'

# Configure sudoers and RBAC privileges for passwordless escalation
Postboot 'mkdir -p /etc/sudoers.d'
Postboot 'echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant'
Postboot 'chmod 0440 /etc/sudoers.d/vagrant'
Postboot 'grep -q "^#includedir /etc/sudoers.d" /etc/sudoers || echo "#includedir /etc/sudoers.d" >> /etc/sudoers'
Postboot 'usermod -P "Primary Administrator" vagrant 2>/dev/null || true'

# Configure SSH daemon for provisioning access
Postboot 'sed -i "s/^#*PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config'
Postboot 'sed -i "s/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/" /etc/ssh/sshd_config'
Postboot 'sed -i "s/^#*PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config'
Postboot 'svcadm restart ssh 2>/dev/null || true'
